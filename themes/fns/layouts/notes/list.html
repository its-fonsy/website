{{ partial "header.html" . }}

<h1>{{ .Title }}</h1>

{{ .Content }}

{{ range $term, $tax := .Site.Taxonomies.notes }}
<div class="box">
    <div class="box-title">{{ $term }}</div>
    <div class="box-content">
        {{ range $tax }}
            <a href="{{ .Page.RelPermalink }}" class="note-link">{{ .Title }}</a>
        {{end}}
    </div>
</div>
{{ end }}

{{ partial "footer.html" . }}
